<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supplier Portal | Cloth.sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a365d; --secondary: #e2e8f0; --accent: #3182ce; --success: #38a169; --text-main: #2d3748; --bg-body: #f7fafc; --bg-card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 15px; }
        
        .container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; padding-bottom: 20px; }
        .header { background-color: var(--primary); color: white; padding: 25px 15px; text-align: center; }
        .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .header p { font-size: 14px; color: #cbd5e0; }
        .supp-name { color: #ecc94b; font-weight: 800; font-size: 26px; text-transform: uppercase; margin-top: 10px; display: block; }
        
        .tabs { display: flex; gap: 10px; margin: 20px; }
        .tab-btn { flex: 1; padding: 12px 10px; text-align: center; font-weight: 700; font-size: 15px; border-radius: 8px; cursor: pointer; border: 1px solid var(--secondary); background: #f8fafc; color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 0 20px; }
        .photo-card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--secondary); background: #000; aspect-ratio: 3/4; }
        .photo-img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.95; }
        
        .status-badge { position: absolute; bottom: 0; left: 0; width: 100%; padding: 8px; font-size: 12px; font-weight: 700; text-align: center; color: white; }
        .status-pending { background: rgba(0,0,0,0.7); }
        .status-received { background: rgba(56, 161, 105, 0.9); }
        .date-badge { position: absolute; top: 5px; left: 5px; background: rgba(26,54,93,0.85); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        
        .empty-state { text-align: center; color: #718096; font-size: 14px; padding: 30px; grid-column: 1 / -1; }
        #loader { text-align: center; padding: 40px; font-weight: bold; font-size: 18px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Cloth.sync Portal</h1>
            <p>Live Order Status for</p>
            <span class="supp-name" id="supplierNameDisplay">Loading...</span>
        </div>

        <div class="tabs" style="display:none;" id="tabContainer">
            <div class="tab-btn active" id="tabPending" onclick="switchTab('pending')">⏳ Pending (<span id="cPending">0</span>)</div>
            <div class="tab-btn" id="tabReceived" onclick="switchTab('received')">✅ Received (<span id="cReceived">0</span>)</div>
        </div>

        <div id="loader">⏳ Loading live data...</div>
        <div id="gallery" class="photo-grid"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Same Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBLe_HEFq_pGZ-vlTOhYhZ6O818vVAanSk",
            authDomain: "cloth-sync.firebaseapp.com",
            projectId: "cloth-sync",
            storageBucket: "cloth-sync.firebasestorage.app",
            messagingSenderId: "346627401157",
            appId: "1:346627401157:web:9f058d28c360fd2e9b97ac",
            measurementId: "G-6DMDEZRDS1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const targetSupplier = urlParams.get('name');
        
        let allPhotos = [];
        let currentTab = 'pending';

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabPending').classList.remove('active');
            document.getElementById('tabReceived').classList.remove('active');
            if(tab === 'pending') document.getElementById('tabPending').classList.add('active');
            else document.getElementById('tabReceived').classList.add('active');
            renderPhotos();
        };

        async function fetchData() {
            if (!targetSupplier) {
                document.getElementById('supplierNameDisplay').innerText = "Invalid Link";
                document.getElementById('loader').innerText = "No supplier specified in the link.";
                return;
            }

            document.getElementById('supplierNameDisplay').innerText = targetSupplier;
            
            try {
                // Fetch only THIS supplier's data
                const q = query(collection(db, "orders"), where("supplier", "==", targetSupplier));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    allPhotos.push({ id: doc.id, ...doc.data() });
                });

                document.getElementById('loader').style.display = 'none';
                document.getElementById('tabContainer').style.display = 'flex';
                
                renderPhotos();
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerText = "Failed to load data.";
            }
        }

        function renderPhotos() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";

            let pendingCount = allPhotos.filter(i => i.status === 'pending').length;
            let receivedCount = allPhotos.filter(i => i.status === 'received').length;
            document.getElementById('cPending').innerText = pendingCount;
            document.getElementById('cReceived').innerText = receivedCount;

            let displayData = allPhotos.filter(i => i.status === currentTab).sort((a,b) => b.timestamp - a.timestamp);

            if(displayData.length === 0) {
                gallery.innerHTML = `<div class="empty-state">No designs found in this section.</div>`;
                return;
            }

            displayData.forEach(item => {
                let displayDate = item.orderDate ? new Date(item.orderDate).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : 'No Date';
                let statusBadge = item.status === 'pending' 
                    ? `<div class="status-badge status-pending">⏳ Pending</div>` 
                    : `<div class="status-badge status-received">✅ Received</div>`;

                gallery.innerHTML += `
                    <div class="photo-card">
                        <div class="date-badge">Ord: ${displayDate}</div>
                        <img src="${item.imageURL}" class="photo-img" loading="lazy">
                        ${statusBadge}
                    </div>
                `;
            });
        }

        // Run on load
        fetchData();
    </script>
</body>
</html>
