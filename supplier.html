<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Order Status | Cloth.sync</title>
    <!-- PWA Setup -->
    <link id="manifestLink" rel="manifest" href="">
    <meta name="theme-color" content="#1e1e2d">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #1e1e2d; --bg-main: #f5f8fa; --card-bg: #ffffff; --text-dark: #181c32; --text-muted: #a1a5b7; --border-light: #eff2f5; --stat-pending-bg: #fff5f8; --stat-pending-text: #f1416c; --stat-received-bg: #e8fff3; --stat-received-text: #50cd89; --stat-cancel-bg: #f8f9fa; --stat-cancel-text: #718096; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); }
        
        .navbar { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 20px; font-weight: 800; color: var(--primary); }
        .nav-profile { font-weight: 600; font-size: 14px; background: var(--bg-main); padding: 6px 12px; border-radius: 20px; }
        
        #installAppBtn { display: none; background: #ecc94b; color: #744210; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right:10px; }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .page-header { margin-bottom: 25px; }
        .page-title { font-size: 26px; font-weight: 800; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; font-weight: 500; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { padding: 15px; border-radius: 12px; border: 1px solid var(--border-light); text-align: center; background: white; }
        .stat-card.pending .stat-value { color: var(--stat-pending-text); }
        .stat-card.cancelled .stat-value { color: var(--stat-cancel-text); }
        .stat-card.received .stat-value { color: var(--stat-received-text); }
        .stat-title { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .stat-value { font-size: 24px; font-weight: 800; }

        .tabs-container { display: flex; gap: 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 25px; overflow-x: auto; }
        .tab-item { padding: 10px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
        .tab-item.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-light); overflow: hidden; position: relative; }
        .img-wrapper { width: 100%; aspect-ratio: 4/5; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; color: white; }
        .badge.pending { background: #ff9800; }
        .badge.cancelled { background: var(--stat-cancel-text); }
        .badge.received { background: var(--stat-received-text); }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .badge-new { position: absolute; top: 10px; right: 10px; background: #e53e3e; color: white; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; animation: pulse 1.5s infinite; }
        .late-warning-card { border: 2px solid #e53e3e !important; box-shadow: 0 0 10px rgba(229,62,62,0.3); }

        .card-details { padding: 12px; }
        .order-id { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 5px; }
        .order-date { font-size: 11px; font-weight: 600; color: var(--text-dark); background: var(--bg-main); padding: 4px; border-radius: 4px; display: inline-block; }

        .pagination-controls { display: flex; justify-content: space-between; margin-top: 25px; padding: 15px; background: white; border-radius: 8px; border: 1px solid var(--border-light); }
        .pagination-controls button { padding: 8px 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .pagination-controls button:disabled { background: var(--text-muted); cursor: not-allowed; }
        
        #loader { text-align: center; padding: 50px; font-weight: 700; color: var(--text-muted); }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <script>
        const manifest = { "name": "Supplier Portal", "short_name": "Supplier", "display": "standalone", "background_color": "#ffffff", "theme_color": "#1e1e2d", "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3159/3159614.png", "sizes": "512x512", "type": "image/png"}] };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);
        const swBlob = new Blob([`self.addEventListener('fetch', function(e) {});`], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installAppBtn').style.display = 'inline-block'; });
        function installApp() { if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('installAppBtn').style.display = 'none'; } }
    </script>

    <div class="navbar">
        <div class="nav-brand">👕 Cloth.sync</div>
        <div>
            <button id="installAppBtn" onclick="installApp()">📲 Install App</button>
            <span class="nav-profile">👤 <span id="navSupplierName">Loading...</span></span>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Live Order Status</h1>
            <p class="page-subtitle">Updates for <strong id="headerSupplierName">...</strong></p>
        </div>

        <div class="stats-grid" id="statsSection" style="display: none;">
            <div class="stat-card pending"><div class="stat-title">Pending</div><div class="stat-value" id="vPend">0</div></div>
            <div class="stat-card cancelled"><div class="stat-title">Cancelled</div><div class="stat-value" id="vCancel">0</div></div>
            <div class="stat-card received"><div class="stat-title">Received</div><div class="stat-value" id="vRec">0</div></div>
            <div class="stat-card total"><div class="stat-title">Total</div><div class="stat-value" id="vTot">0</div></div>
        </div>

        <div class="tabs-container" id="tabSection" style="display: none;">
            <div class="tab-item active" id="tabAll" onclick="switchTab('all')">All Orders</div>
            <div class="tab-item" id="tabPending" onclick="switchTab('pending')">Pending</div>
            <div class="tab-item" id="tabCancelled" onclick="switchTab('cancelled')">Cancelled</div>
            <div class="tab-item" id="tabReceived" onclick="switchTab('received')">Received</div>
        </div>

        <div id="loader">⏳ Fetching live data securely...</div>
        <div id="gallery" class="photo-grid"></div>

        <div id="paginationControls" class="pagination-controls" style="display:none;">
            <button id="prevBtn" onclick="changePage(-1)">⬅️ Prev</button>
            <span id="pageInfo" style="font-weight: bold; font-size: 14px;">Page 1</span>
            <button id="nextBtn" onclick="changePage(1)">Next ➡️</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBLe_HEFq_pGZ-vlTOhYhZ6O818vVAanSk", authDomain: "cloth-sync.firebaseapp.com", projectId: "cloth-sync", storageBucket: "cloth-sync.firebasestorage.app", messagingSenderId: "346627401157", appId: "1:346627401157:web:9f058d28c360fd2e9b97ac", measurementId: "G-6DMDEZRDS1" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const targetSupplier = urlParams.get('name');
        
        let allPhotos = []; let currentTab = 'all'; let currentPage = 1; const itemsPerPage = 20;

        window.switchTab = function(tab) {
            currentTab = tab; currentPage = 1;
            ['tabAll','tabPending','tabCancelled','tabReceived'].forEach(t => document.getElementById(t).classList.remove('active'));
            document.getElementById(tab === 'all' ? 'tabAll' : 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            renderPhotos();
        };

        window.changePage = function(dir) { currentPage += dir; renderPhotos(); document.getElementById('tabSection').scrollIntoView({ behavior: 'smooth' }); };

        async function fetchData() {
            if (!targetSupplier) { document.getElementById('loader').innerText = "Invalid Link"; return; }
            document.getElementById('navSupplierName').innerText = targetSupplier;
            document.getElementById('headerSupplierName').innerText = targetSupplier;
            
            try {
                await setDoc(doc(db, "supplier_views", targetSupplier), { lastSeen: Date.now() });

                const q = query(collection(db, "orders"), where("supplier", "==", targetSupplier));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => allPhotos.push({ id: doc.id, ...doc.data() }));

                document.getElementById('loader').style.display = 'none';
                document.getElementById('statsSection').style.display = 'grid';
                document.getElementById('tabSection').style.display = 'flex';
                
                document.getElementById('vTot').innerText = allPhotos.length;
                document.getElementById('vPend').innerText = allPhotos.filter(i => i.status === 'pending').length;
                document.getElementById('vCancel').innerText = allPhotos.filter(i => i.status === 'cancelled').length;
                document.getElementById('vRec').innerText = allPhotos.filter(i => i.status === 'received').length;

                renderPhotos();
            } catch (error) { document.getElementById('loader').innerText = "Failed to load data."; }
        }

        function renderPhotos() {
            const gallery = document.getElementById('gallery');
            let dispData = currentTab === 'all' ? allPhotos : allPhotos.filter(i => i.status === currentTab);
            
            dispData.sort((a, b) => {
                let timeB = b.receivedDate ? new Date(b.receivedDate).getTime() : b.timestamp;
                let timeA = a.receivedDate ? new Date(a.receivedDate).getTime() : a.timestamp;
                return timeB !== timeA ? timeB - timeA : b.timestamp - a.timestamp; 
            });

            if(dispData.length === 0) { gallery.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-muted);">No designs found.</div>`; document.getElementById('paginationControls').style.display = "none"; return; }

            let totalPages = Math.ceil(dispData.length / itemsPerPage);
            let paginated = dispData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            if(dispData.length > itemsPerPage) {
                document.getElementById('paginationControls').style.display = "flex";
                document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prevBtn').disabled = (currentPage === 1);
                document.getElementById('nextBtn').disabled = (currentPage === totalPages);
            } else { document.getElementById('paginationControls').style.display = "none"; }

            gallery.innerHTML = "";
            let today = new Date().toISOString().split('T')[0];

            paginated.forEach(item => {
                let oDate = item.orderDate ? new Date(item.orderDate).toLocaleDateString('en-IN') : 'No Date';
                let idStr = "#CS-" + item.id.substring(0, 6).toUpperCase(); 
                
                let bHTML = item.status === 'pending' ? `<div class="badge pending">⏳ Pending</div>` 
                          : item.status === 'cancelled' ? `<div class="badge cancelled">🚫 Cancelled</div>`
                          : `<div class="badge received">✅ Received</div>`;
                
                let isNew = (item.status === 'received' && item.receivedDate === today) || (item.orderDate === today);
                let newB = isNew ? `<div class="badge-new">✨ NEW</div>` : "";
                
                let lateC = "";
                if (item.status === 'pending' && item.orderDate) {
                    if((new Date() - new Date(item.orderDate)) / 86400000 > 15) lateC = "late-warning-card";
                }

                gallery.innerHTML += `
                    <div class="product-card ${lateC}">
                        <div class="img-wrapper">${bHTML}${newB}<img src="${item.imageURL}" class="product-img" loading="lazy"></div>
                        <div class="card-details">
                            <span class="order-id">${idStr}</span>
                            <div style="margin-top:5px;"><span style="font-size:10px;color:#a1a5b7;">Ord Date:</span> <span class="order-date">${oDate}</span></div>
                            ${(item.status === 'received' && item.receivedDate) ? `<div style="margin-top:5px;"><span style="font-size:10px;color:#50cd89;">Rcv Date:</span> <span class="order-date" style="background:#e8fff3;color:#50cd89;">${new Date(item.receivedDate).toLocaleDateString('en-IN')}</span></div>` : ''}
                        </div>
                    </div>
                `;
            });
        }
        fetchData();
    </script>
</body>
</html>
